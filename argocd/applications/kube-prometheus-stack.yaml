# Prometheus + Grafana (kube-prometheus-stack)
# NOTE: targetRevision is a semver range so ArgoCD can always resolve a chart.
#       Pin an exact version for production.
apiVersion: argoproj.io/v1alpha1
kind: Application
metadata:
  name: kube-prometheus-stack
  namespace: argocd
spec:
  project: default
  source:
    repoURL: https://prometheus-community.github.io/helm-charts
    chart: kube-prometheus-stack
    targetRevision: ">=70.0.0"
    helm:
      releaseName: kube-prometheus-stack
      values: |
        # GKE Autopilot: control-plane components are managed & kube-system is
        # read-only — disable their monitors (standard GKE practice).
        kubeEtcd:
          enabled: false
        kubeScheduler:
          enabled: false
        kubeControllerManager:
          enabled: false
        kubeProxy:
          enabled: false
        kubeApiServer:
          enabled: false
        # Autopilot Warden also blocks the operator's kubelet service in
        # kube-system; node-exporter needs host access Autopilot forbids.
        kubelet:
          enabled: false
        kubeDns:
          enabled: false
        coreDns:
          enabled: false
        nodeExporter:
          enabled: false
        # Autopilot: kubelet/node rules can't work (no kubelet scraping) and
        # overcommit alerts are for self-managed clusters — keep only our
        # custom seondal-pay-alerts PrometheusRule.
        defaultRules:
          rules:
            kubelet: false
            node: false
            nodeNetwork: false
            nodeFilesystem: false
            kubernetesApps: false
            kubernetesResources: false
            kubernetesStorage: false
            kubernetesSystem: false
            kubeScheduler: false
            kubeStateMetrics: false
            network: false
        prometheus:
          prometheusSpec:
            retention: 7d
        alertmanager:
          # Discord via its Slack-compatible webhook endpoint.
          # The URL lives in Secret alert-discord-webhook/discord-webhook-url
          # (created by scripts/bootstrap_gke.sh — never committed).
          alertmanagerSpec:
            secrets:
              - alert-discord-webhook
          config:
            route:
              receiver: discord
              group_by: ['alertname', 'severity', 'namespace']
              group_wait: 30s
              group_interval: 5m
              repeat_interval: 4h
            receivers:
              - name: discord
                slack_configs:
                  - api_url_file: /etc/alertmanager/secrets/alert-discord-webhook/discord-webhook-url
                    channel: '#seondal-alerts'
                    username: 'SEONDAL Alertmanager'
                    icon_emoji: ':rotating_light:'
                    title: '[{{ .CommonLabels.severity | toUpper }}] {{ .CommonLabels.alertname }}'
                    text: >-
                      {{ range .Alerts }}*{{ .Annotations.summary }}*
                      {{ .Annotations.description }}
                      {{ end }}
              # chart injects a Watchdog sub-route → receiver 'null'; it must exist
              - name: "null"
        grafana:
          adminPassword: seondal-admin   # demo credential — rotate in production
          service:
            type: LoadBalancer            # evaluators get a public Grafana IP
          additionalDataSources:
            - name: Loki
              uid: loki
              type: loki
              access: proxy
              isDefault: false
              url: http://loki.monitoring:3100
              jsonData:
                maxLines: 1000
            - name: Tempo
              uid: tempo
              type: tempo
              access: proxy
              isDefault: false
              url: http://tempo.monitoring:3100
              jsonData:
                tracesToLogsV2:
                  datasourceUid: loki
                  spanStartTimeShift: "-1h"
                  spanEndTimeShift: "1h"
                  filterByTraceID: true
  destination:
    server: https://kubernetes.default.svc
    namespace: monitoring
  syncPolicy:
    automated:
      prune: true
      selfHeal: true
    syncOptions:
      - CreateNamespace=true
      # CRD annotations exceed kubectl-apply 256KB limit → server-side apply
      - ServerSideApply=true
