apiVersion: apps/v1
kind: Deployment
metadata:
  name: sol-web-paysh
  namespace: default
  labels:
    app: sol-web-paysh
    tier: frontend-gateway
spec:
  replicas: 2
  selector:
    matchLabels:
      app: sol-web-paysh
  template:
    metadata:
      labels:
        app: sol-web-paysh
        tier: frontend-gateway
    spec:
      containers:
      - name: sol-web-paysh
        image: gcr.io/seocho-project/sol-web-paysh:latest
        imagePullPolicy: Always
        ports:
        - containerPort: 3000
          name: http-web
        env:
        - name: PORT
          value: "3000"
        - name: SEOCHO_AGENT_SERVICE_URL
          value: "http://seocho-service.default.svc.cluster.local:8000"
        - name: SOLANA_RPC_URL
          value: "https://api.devnet.solana.com"
        resources:
          requests:
            memory: "512Mi"
            cpu: "250m"
          limits:
            memory: "2Gi"
            cpu: "1000m"
        livenessProbe:
          httpGet:
            path: /api/health
            port: 3000
          initialDelaySeconds: 10
          periodSeconds: 15
        readinessProbe:
          httpGet:
            path: /api/health
            port: 3000
          initialDelaySeconds: 5
          periodSeconds: 10
---
apiVersion: v1
kind: Service
metadata:
  name: sol-web-service
  namespace: default
  labels:
    app: sol-web-paysh
spec:
  type: LoadBalancer
  ports:
  - port: 80
    targetPort: 3000
    name: http-web
  selector:
    app: sol-web-paysh
