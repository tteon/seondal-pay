apiVersion: v1
kind: ConfigMap
metadata:
  name: seondal-pay-config
  namespace: seondal
  labels:
    app: seondal-pay
data:
  PORT: "3000"
  NODE_ENV: "production"
  DEPLOY_ENV: "gke"
  SERVICE_VERSION: "1.0.0"
  OTEL_SERVICE_NAME: "seondal-pay"
  # OTel Collector runs in the monitoring namespace (ArgoCD-managed)
  OTEL_EXPORTER_OTLP_ENDPOINT: "http://opentelemetry-collector.monitoring:4318"
  MPP_CHALLENGE_TTL_SECONDS: "300"
  MPP_REALM: "seocho-pay"
  MPP_SOLANA_NETWORK: "devnet"
