apiVersion: monitoring.coreos.com/v1
kind: ServiceMonitor
metadata:
  name: seondal-pay
  namespace: seondal
  labels:
    app: seondal-pay
    # kube-prometheus-stack only selects ServiceMonitors carrying its release label
    release: kube-prometheus-stack
spec:
  selector:
    matchLabels:
      app: seondal-pay
  endpoints:
    - port: http
      path: /metrics
      interval: 15s
      scrapeTimeout: 10s
